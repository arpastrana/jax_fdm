name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Weekly unlocked run against the newest dependencies, an early warning for upstream breakage.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Cancel a PR's in-flight run when new commits are pushed to it. Every other
# event gets a run-unique group, so a stuck run never holds up a later one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The sync step decides the environment; a run step must not re-sync default groups.
  UV_NO_SYNC: "1"

jobs:
  build-package:
    if: "!contains(github.event.pull_request.labels.*.name, 'docs-only')"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Floor and ceiling of the supported range on every runner OS.
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # PySide6 (via compas_viewer) links against system GL libraries that the
      # headless Linux runners do not ship.
      - name: Install GL libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0

      # --locked fails if uv.lock drifted from pyproject.toml; the weekly schedule resolves fresh instead.
      - name: Install package
        run: uv sync ${{ github.event_name == 'schedule' && '--upgrade' || '--locked' }} --no-default-groups --group dev --extra viz

      - name: Show what moved relative to uv.lock
        if: github.event_name == 'schedule'
        run: git --no-pager diff --stat uv.lock

      - name: Lint with ruff
        run: uv run ruff check .

      # The suite recompiles the same jitted equilibrium models every run, so
      # the runtime is XLA-compilation-bound. Persist the compiled kernels
      # across CI runs; the key includes the jax version so a jax bump (which
      # changes the emitted HLO) starts a fresh cache. The absolute dir goes
      # through GITHUB_ENV so actions/cache and JAX resolve the same path
      # (GitHub does not expand ~ inside an env: block, and JAX reads it raw).
      - name: Resolve jit cache location
        id: jax
        shell: bash
        run: |
          echo "version=$(uv run python -c 'import jax; print(jax.__version__)')" >> "$GITHUB_OUTPUT"
          echo "JAX_COMPILATION_CACHE_DIR=$RUNNER_TEMP/jax_fdm_jit_cache" >> "$GITHUB_ENV"

      - name: Cache compiled XLA kernels
        uses: actions/cache@v4
        with:
          path: ${{ env.JAX_COMPILATION_CACHE_DIR }}
          key: jax-jit-${{ matrix.os }}-py${{ matrix.python-version }}-jax${{ steps.jax.outputs.version }}

      - name: Run tests
        run: uv run pytest
