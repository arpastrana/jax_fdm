# Pre-commit hooks for jax_fdm. Install with:
#
#     uv run pre-commit install
#
# Run against all files with:
#
#     uv run pre-commit run --all-files
#
repos:
  - repo: local
    hooks:
      # Both hooks run the ruff pinned in uv.lock (pulled in on demand), so hook and `uv run ruff` agree.
      - id: ruff
        name: ruff
        entry: uv run --group dev ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      # Format the code, including snippets inside docstrings.
      - id: ruff-format
        name: ruff format
        entry: uv run --group dev ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # data/ JSON fixtures and exported SVG assets stay byte-stable, so both are excluded.
      - id: trailing-whitespace
        exclude: ^data/|\.svg$
      - id: end-of-file-fixer
        exclude: ^data/|\.svg$
      # --unsafe checks YAML syntax without constructing custom tags; mkdocs.yml
      # uses !!python/name:... tags (pymdownx fences) that the default loader
      # cannot build.
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-merge-conflict

  - repo: local
    hooks:
      # The docs citation page is generated from CITATION.cff, but GitHub
      # renders the README raw, so its hand-written BibTeX can drift. Fail if
      # the README stops citing the preferred DOI from CITATION.cff.
      - id: readme-cites-preferred-doi
        name: README cites the preferred DOI from CITATION.cff
        entry: python docs/hooks/citation.py
        language: python
        additional_dependencies: [pyyaml]
        files: ^(README\.md|CITATION\.cff)$
        pass_filenames: false
